<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sm-fav-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1B2436"/>
      <stop offset="100%" stopColor="#121824"/>
    </linearGradient>
    <linearGradient id="sm-fav-border" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stopColor="#0284C7" stop-opacity="0.3"/>
      <stop offset="100%" stopColor="#1e293b" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="sm-fav-hand-1" x1="13" y1="12" x2="35" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8"/>
      <stop offset="100%" stopColor="#0284C7"/>
    </linearGradient>
    <linearGradient id="sm-fav-hand-2" x1="35" y1="36" x2="13" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8"/>
      <stop offset="100%" stopColor="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Squircle Canvas Frame -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#sm-fav-bg)" stroke="url(#sm-fav-border)" stroke-width="1.5"/>

  <!-- Upper Hand Gesture Arc -->
  <path d="M 13 24 C 13 17 18 12 25 12 C 30.5 12 34.5 15.5 35 20 C 35 21.5 33.8 22.5 32.3 22.5 C 31 22.5 30 21.8 29.5 20.5 C 28.5 18 26.2 16.5 24 16.5 C 19.5 16.5 17.5 19.8 17.5 23.5 C 17.5 24.8 16.5 25.8 15.2 25.8 C 14 25.8 13 25 13 24 Z" fill="url(#sm-fav-hand-1)"/>

  <!-- Lower Hand Gesture Arc (Interlocking Partner Arc) -->
  <path d="M 35 24 C 35 31 30 36 23 36 C 17.5 36 13.5 32.5 13 28 C 13 26.5 14.2 25.5 15.7 25.5 C 17 25.5 18 26.2 18.5 27.5 C 19.5 30 21.8 31.5 24 31.5 C 28.5 31.5 30.5 28.2 30.5 24.5 C 30.5 23.2 31.5 22.2 32.8 22.2 C 34 22.2 35 23 35 24 Z" fill="url(#sm-fav-hand-2)"/>

  <!-- Center Aperture / Translation Iris -->
  <circle cx="24" cy="24" r="3.2" fill="#F8FAFC"/>
  <circle cx="24" cy="24" r="5.8" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 2" stroke-opacity="0.85"/>

  <!-- Landmark Joint Nodes -->
  <circle cx="31" cy="17" r="1.6" fill="#38bdf8"/>
  <circle cx="17" cy="31" r="1.6" fill="#38bdf8"/>
  <circle cx="24" cy="12" r="1.2" fill="#60a5fa" fill-opacity="0.9"/>
  <circle cx="24" cy="36" r="1.2" fill="#60a5fa" fill-opacity="0.9"/>
</svg>